[project]
name = "scentvault-api"
version = "2.0.0"
description = "ScentVault API — fragrance catalog, personal collection, wear log, AI advisor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "arq>=0.26",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.12",
    "anyio>=4.4",
]

[project.optional-dependencies]
# The real embedding model. Without it the API falls back to a deterministic
# hashing embedder (fine for dev/tests, much weaker similarity).
ml = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "seeds", "scripts"]
