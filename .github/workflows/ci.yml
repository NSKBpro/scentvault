name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scentvault
          POSTGRES_PASSWORD: scentvault
          POSTGRES_DB: scentvault_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scentvault" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://scentvault:scentvault@localhost:5432/scentvault_test
      DATABASE_URL: postgresql+asyncpg://scentvault:scentvault@localhost:5432/scentvault_test
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy app scripts
      - run: python -m scripts.gen_types --check
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE --tb=short 2>&1 | tee pytest.log || {
            # Surface each failure as an annotation (visible on the run summary page).
            grep -E "^(FAILED|ERROR) " pytest.log | head -20 | while read -r line; do echo "::error title=pytest::$line"; done
            grep -E "^E   " pytest.log | head -15 | while read -r line; do echo "::error title=pytest detail::$line"; done
            exit 1
          }
      - name: Migrations match the models
        run: alembic check

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint .
      - run: npx vite build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
